<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Log In &mdash; Voice Agent</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --border: #e2e6ef; --text: #1a1f2e;
    --muted: #6b7280; --accent: #2f6fed; --accent-dark: #1f4fc4; --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px; width: 100%; max-width: 360px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px;
  }
  button {
    margin-top: 20px; width: 100%; padding: 10px 18px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer; background: var(--accent); color: white;
  }
  button:hover { background: var(--accent-dark); }
  .errors { color: var(--red); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
  <form class="card" method="post">
    {% csrf_token %}
    <h1>AI Voice Agent</h1>
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autofocus required>
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" required>
    {% if form.errors %}
      <div class="errors">Incorrect username or password.</div>
    {% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log In</button>
  </form>
</body>
</html>
